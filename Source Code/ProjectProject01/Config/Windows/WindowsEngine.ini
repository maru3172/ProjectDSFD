; Keep the shared local cache warm across editor/test-server restarts.
; No cache is deleted, and cooked clients/servers do not depend on this editor DDC.
[Zen.AutoLaunch]
LimitProcessLifetime=False
; This Windows project does not deploy via Android adb. Do not start an adb
; forwarder on every local Zen launch (adb is not installed on this machine).
!Plugins=ClearArray
